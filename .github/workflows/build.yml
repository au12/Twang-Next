name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release when VERSION is new
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests (native, sanitizers)
        run: bash tests/run.sh
      - name: WebAssembly engine
        run: bash wasm/build.sh
      - name: Web UI bundle
        run: python3 web/build.py
      - name: Install arduino-cli and the ESP32 core
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_latest_Linux_64bit.tar.gz | tar xz
          ./arduino-cli config init
          ./arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          ./arduino-cli core update-index
          ./arduino-cli core install esp32:esp32
          ./arduino-cli lib install FastLED "ESP Async WebServer" "Async TCP" RadioLib
      - name: Firmware (APA102 + DAC, the stock board)
        run: ./arduino-cli compile -b esp32:esp32:esp32:PartitionScheme=min_spiffs --export-binaries TWANG32
      - name: Wireless controller (XIAO ESP32-C3)
        run: ./arduino-cli compile -b esp32:esp32:XIAO_ESP32C3 --export-binaries controller/TWANGController
      - uses: actions/upload-artifact@v4
        with:
          name: twang-next
          path: |
            TWANG32/build/esp32.esp32.esp32/TWANG32.ino.bin
            TWANG32/build/esp32.esp32.esp32/TWANG32.ino.merged.bin
            controller/TWANGController/build/esp32.esp32.XIAO_ESP32C3/TWANGController.ino.merged.bin
            build/web/index.html
      # Bump VERSION on main and this publishes release v<version> with the firmware, controller
      # and web UI builds attached. Notes come from CHANGELOG.md ("## <version>") or GitHub's
      # generated notes.
      - name: Publish release if the version is new
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          : > notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              /^## / { if (found) exit; h = $2; gsub(/[\[\]v]/, "", h); if (h == v) { found = 1; next } }
              found
            ' CHANGELOG.md > notes.md
          fi
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          mkdir -p release
          cp TWANG32/build/esp32.esp32.esp32/TWANG32.ino.bin "release/TWANG-Next-$version-firmware.bin"
          cp TWANG32/build/esp32.esp32.esp32/TWANG32.ino.merged.bin "release/TWANG-Next-$version-firmware-merged.bin"
          cp controller/TWANGController/build/esp32.esp32.XIAO_ESP32C3/TWANGController.ino.merged.bin "release/TWANG-Next-$version-controller-merged.bin"
          cp build/web/index.html "release/TWANG-Next-$version-web.html"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" "${notes[@]}" release/*
